# ⚠️ 历史遗留配置（2026-09-06 起生产已迁移 Cloudflare Pages，见 docs/运维手册-部署与额度.md）
# 本文件仅服务 Netlify 旧备用站（https://timely-rugelach-be68fd.netlify.app），不再用于日常部署；
# 日常部署走 wrangler 直传。停止 Netlify 自动构建需在 Netlify Dashboard → Build & deploy 暂停。
[build]
  publish = "frontend/dist"
  functions = "backend/functions"
  # 根目录无 package.json，需显式安装依赖：先安装 functions 依赖（供 Netlify 打包进函数），再安装并构建前端
  command = "cd backend/functions && npm install && cd ../../frontend && npm install && npm run build"

# 前端统一通过 /api/* 访问后端函数
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 只读分享链接 SPA 路由（/share/:token 刷新不 404）
[[redirects]]
  from = "/share/*"
  to = "/index.html"
  status = 200
