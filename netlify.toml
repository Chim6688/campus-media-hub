[build]
  publish = "frontend/dist"
  functions = "backend/functions"
  # 根目录无 package.json，需显式安装依赖：先安装 functions 依赖（供 Netlify 打包进函数），再安装并构建前端
  command = "cd backend/functions && npm install && cd ../../frontend && npm install && npm run build"

# 前端统一通过 /api/* 访问后端函数
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 只读分享链接 SPA 路由（/share/:token 刷新不 404）
[[redirects]]
  from = "/share/*"
  to = "/index.html"
  status = 200
